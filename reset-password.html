<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#6d35d4">
<title>Reset Password | JOINT</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:#f4f2fa;color:#202124;font-family:Arial,sans-serif}.card{width:100%;max-width:480px;padding:32px 24px;background:#fff;border-radius:22px;box-shadow:0 8px 30px #00000012}.logo{margin:0 0 24px;color:#6b35ce;font-size:34px;font-weight:800}h1{margin:0 0 12px;font-size:27px}.description{color:#6c7078;line-height:1.6;margin-bottom:24px}.field{margin-bottom:18px}label{display:block;margin-bottom:8px;font-weight:700}input{width:100%;padding:14px;border:1px solid #d8d8e0;border-radius:10px;font-size:16px}.primary{width:100%;padding:15px;border:0;border-radius:10px;background:#6d35d4;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.primary:disabled{opacity:.6;cursor:wait}.message{display:none;margin:18px 0;padding:14px;border-radius:10px;line-height:1.5;overflow-wrap:anywhere}.message.error{display:block;background:#fff0f0;color:#a12626}.message.success{display:block;background:#e8f7ef;color:#126b43}.back{display:block;margin-top:22px;text-align:center;color:#6332bd;text-decoration:none;font-weight:700}.small{margin-top:18px;color:#777;font-size:13px;line-height:1.5}
</style></head><body><main class="card"><div class="logo">JOINT</div><h1>Reset your password</h1><p class="description">Enter the six-digit code sent to your email, then choose a new password. The code expires after 10 minutes.</p>
<form id="reset-form"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="code">Six-digit verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" minlength="6" required placeholder="123456"></div><div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></div><div class="field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Enter the password again"></div><div id="message" class="message" role="status" aria-live="polite"></div><button id="submit-button" class="primary" type="submit">Verify code and update password</button></form>
<button id="resend-button" class="primary" type="button" style="margin-top:12px;background:#eee7fb;color:#5124a8">Send a new code</button><a class="back" href="auth.html">Back to sign in</a><p class="small">Never share your verification code or password with anyone.</p></main>
<script>
const ENDPOINT="https://pkadxjsadopktlnlxnhc.supabase.co/functions/v1/joint-password-reset-code";const emailInput=document.getElementById('email'),codeInput=document.getElementById('code'),passwordInput=document.getElementById('password'),confirmInput=document.getElementById('confirm-password'),form=document.getElementById('reset-form'),submitButton=document.getElementById('submit-button'),resendButton=document.getElementById('resend-button'),message=document.getElementById('message');
emailInput.value=sessionStorage.getItem('joint_password_reset_email')||new URLSearchParams(location.search).get('email')||'';
function showMessage(text,type='error'){message.textContent=text;message.className='message '+type}
async function callApi(payload){const response=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||'Request failed. Please try again.');return result}
form.addEventListener('submit',async event=>{event.preventDefault();const email=emailInput.value.trim().toLowerCase(),code=codeInput.value.trim(),password=passwordInput.value;if(!/^\d{6}$/.test(code)){showMessage('Enter the six-digit code from your email.');return}if(password.length<8){showMessage('Your password must contain at least 8 characters.');return}if(password!==confirmInput.value){showMessage('The two passwords do not match.');return}submitButton.disabled=true;submitButton.textContent='Verifying and updating...';try{await callApi({action:'verify_update',email,code,password});showMessage('Your password has been updated successfully. You can now sign in.','success');sessionStorage.removeItem('joint_password_reset_email');form.reset();setTimeout(()=>location.href='auth.html',1800)}catch(error){showMessage(error.message||'We could not update your password. Request a new code and try again.')}finally{submitButton.disabled=false;submitButton.textContent='Verify code and update password'}});
resendButton.addEventListener('click',async()=>{const email=emailInput.value.trim().toLowerCase();if(!emailInput.checkValidity()||!email){showMessage('Enter a valid email address first.');emailInput.focus();return}resendButton.disabled=true;try{await callApi({action:'request',email});sessionStorage.setItem('joint_password_reset_email',email);showMessage('If an account exists for that email, a new code has been sent.','success')}catch(error){showMessage(error.message||'Could not send a new code.')}finally{resendButton.disabled=false}});
</script><script src="operation-loading-bar.js" defer></script><script src="auto-linkify.js" defer></script></body></html>
