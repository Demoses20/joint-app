<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | JOINT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f2fa;
      color: #202124;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 32px 24px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
    }

    .logo {
      margin: 0 0 24px;
      color: #6b35ce;
      font-size: 34px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 27px;
    }

    .description {
      color: #6c7078;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .password-wrap {
      display: flex;
      align-items: center;
      border: 1px solid #d8d8e0;
      border-radius: 10px;
      overflow: hidden;
    }

    .password-wrap input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8d8e0;
      border-radius: 10px;
      font-size: 16px;
    }

    .password-wrap button {
      padding: 12px;
      border: 0;
      background: #fff;
      color: #6332bd;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #087f5b;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      display: none;
      margin: 18px 0;
      padding: 14px;
      border-radius: 10px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a12626;
    }

    .message.success {
      display: block;
      background: #e8f7ef;
      color: #126b43;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #6332bd;
      text-decoration: none;
      font-weight: 700;
    }

    .small {
      margin-top: 18px;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">JOINT</div>

    <h1>Choose a new password</h1>

    <p class="description">
      Enter your new password below. You must open this page using
      the password-reset link sent to your email.
    </p>

    <form id="reset-form">
      <div class="field">
        <label for="password">New password</label>

        <div class="password-wrap">
          <input
            id="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
            placeholder="At least 8 characters"
          >

          <button type="button" class="toggle" data-target="password">
            Show
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirm-password">Confirm new password</label>

        <div class="password-wrap">
          <input
            id="confirm-password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
            placeholder="Enter the password again"
          >

          <button
            type="button"
            class="toggle"
            data-target="confirm-password"
          >
            Show
          </button>
        </div>
      </div>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <button id="submit-button" class="primary" type="submit">
        Update password
      </button>
    </form>

    <a class="back" href="auth.html">Back to sign in</a>

    <p class="small">
      Keep your password private. JOINT will never ask you to share it
      with another person.
    </p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    /*
      Replace these two values with your existing Supabase project URL
      and publishable key.

      Do not put your Supabase secret key or service_role key here.
    */
    const SUPABASE_URL = "https://pkadxjsadopktlnlxnhc.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_giX0L5ZYqHypU89hq269hw_1uP1KrlC";

    const message = document.getElementById("message");
    const form = document.getElementById("reset-form");
    const submitButton = document.getElementById("submit-button");

    let supabase;
    let ready = false;

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }

    document.querySelectorAll(".toggle").forEach(button => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);
        const reveal = input.type === "password";

        input.type = reveal ? "text" : "password";
        button.textContent = reveal ? "Hide" : "Show";
      });
    });

    async function initialize() {
      if (
        SUPABASE_URL.includes("PASTE_") ||
        SUPABASE_PUBLISHABLE_KEY.includes("PASTE_")
      ) {
        showMessage(
          "Setup is incomplete. Add your Supabase project URL and publishable key to this file."
        );
        submitButton.disabled = true;
        return;
      }

      try {
        supabase = createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

        const url = new URL(window.location.href);
        const code = url.searchParams.get("code");

        /*
          Supabase may return a PKCE code in the URL.
          Exchange it for the recovery session.
        */
        if (code) {
          const { error } = await supabase.auth.exchangeCodeForSession(code);

          if (error) throw error;

          url.searchParams.delete("code");
          window.history.replaceState({}, document.title, url.toString());
        }

        /*
          Older recovery links may contain tokens in the URL fragment.
          Supabase JS can process those tokens when creating the client.
        */
        const { data, error } = await supabase.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          showMessage(
            "This password-reset link is invalid, expired, or already used. Request a new reset email."
          );
          return;
        }

        ready = true;
        submitButton.disabled = false;
        showMessage(
          "Reset link verified. You can now choose your new password.",
          "success"
        );
      } catch (error) {
        showMessage(
          error.message ||
          "We could not verify this reset link. Request a new one and try again."
        );
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!ready || !supabase) {
        showMessage(
          "Your reset link has not been verified. Open the reset link from your email again."
        );
        return;
      }

      const password = document.getElementById("password").value;
      const confirmation =
        document.getElementById("confirm-password").value;

      if (password.length < 8) {
        showMessage("Your password must contain at least 8 characters.");
        return;
      }

      if (password !== confirmation) {
        showMessage("The two passwords do not match.");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Updating password...";

      try {
        const { error } = await supabase.auth.updateUser({
          password: password
        });

        if (error) throw error;

        showMessage(
          "Your password has been updated successfully. You can now sign in with your new password.",
          "success"
        );

        form.reset();

        document.querySelectorAll(".toggle").forEach(button => {
          button.textContent = "Show";
        });

        setTimeout(() => {
          window.location.href = "auth.html";
        }, 2500);

      } catch (error) {
        showMessage(
          error.message ||
          "We could not update your password. Request a new reset link and try again."
        );

        submitButton.disabled = false;
        submitButton.textContent = "Update password";
      }
    });

    submitButton.disabled = true;
    initialize();
  </script>
</body>
</html>
