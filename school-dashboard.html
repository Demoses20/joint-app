<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6938d1"><title>School dashboard — JOINT</title><link rel="stylesheet" href="style.css"><style>
.page{max-width:1050px;margin:auto;padding:22px 14px 110px}.hero{padding:22px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#5424b5,#6938d1,#9869f1);margin-bottom:18px}.hero h1{color:#fff;margin:0 0 8px}.hero p{margin:0;line-height:1.6}.panel{background:#fff;border:1px solid #e7e0f1;border-radius:17px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;min-width:0;padding:12px;border:1px solid #ded7eb;border-radius:10px;font:inherit}.field textarea{min-height:90px}.status{padding:12px;border-radius:10px;background:#f0e8ff;color:#5424b5;margin-top:12px;line-height:1.5}.record{border:1px solid #e7e0f1;border-radius:13px;padding:14px;margin:10px 0}.record h3{margin:0 0 7px}.record p{line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.brand-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.logo{width:68px;height:68px;object-fit:contain;border-radius:12px}.banner{width:100%;max-height:170px;object-fit:cover;border-radius:12px;margin:10px 0}.muted{color:#777486}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html"><span class="brand-mark">J</span> JOINT</a><nav class="main-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="classes.html">Classes</a><a href="my-learning.html">My Learning</a><a href="host-school.html">Hosting application</a><a href="host-dashboard.html">Host dashboard</a></nav><div class="top-actions"><button class="btn secondary" id="sign-out" type="button">Sign out</button></div></div></header><main class="page"><section class="hero"><h1 id="school-title">School dashboard</h1><p id="school-subtitle">Manage your approved school or institute and its classes.</p></section><div id="status" class="status">Loading your approved school…</div><section id="school-info" class="panel hidden"></section><section id="dashboard" class="panel hidden"><h2>Create a class, grade or programme</h2><form id="class-form"><div class="grid"><div class="field"><label for="class-title">Name *</label><input id="class-title" maxlength="140" required></div><div class="field"><label for="class-type">Type</label><select id="class-type"><option>Class</option><option>Grade</option><option>Level</option><option>Course</option><option>Training programme</option></select></div><div class="field"><label for="class-price">Access price (NGN; 0 means free)</label><input id="class-price" type="number" min="0" step="0.01" value="0" required></div><div class="field"><label for="class-duration">Access duration</label><select id="class-duration"><option value="lifetime">Until completion</option><option value="30">30 days</option><option value="90">90 days</option><option value="180">180 days</option><option value="365">365 days</option></select></div><div class="field" style="grid-column:1/-1"><label for="class-description">Description</label><textarea id="class-description" maxlength="1500"></textarea></div><div class="field"><label><input id="class-active" type="checkbox" checked
