<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>People & Follows — JOINT</title><link rel="stylesheet" href="style.css">
<style>
.people-tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.people-tools input{flex:1;min-width:180px}.people-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.people-tabs button{border:1px solid var(--line,#e6e0ee);background:#fff;border-radius:999px;padding:10px 15px;font-weight:700;color:#5b2bbd}.people-tabs button.active{background:#efe7ff;border-color:#d8c5ff}.people-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}.person-card{background:#fff;border:1px solid var(--line,#e6e0ee);border-radius:18px;padding:16px;min-width:0}.person-head{display:flex;gap:12px;align-items:center}.person-avatar{width:54px;height:54px;flex:0 0 54px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#eee5ff;color:#5c2ab9;font-weight:800}.person-avatar img{width:100%;height:100%;object-fit:cover}.person-name{margin:0;font-size:1.02rem;overflow-wrap:anywhere}.person-meta{margin:4px 0;color:var(--muted,#777486);font-size:.9rem}.person-bio{white-space:pre-wrap;overflow-wrap:anywhere}.person-action{width:100%;margin-top:12px;border:0;border-radius:12px;padding:11px;background:#6938d1;color:#fff;font-weight:800}.person-action.following{background:#f0e8ff;color:#5424b5;border:1px solid #d8c5ff}.people-message{padding:12px 14px;border-radius:12px;background:#f5f0ff;color:#55476c;margin:12px 0}.people-count{color:var(--muted,#777486);font-size:.9rem}.people-empty{padding:18px;text-align:center;color:var(--muted,#777486)}
</style></head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html"><span class="brand-mark">J</span> JOINT</a><nav class="main-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="meetings.html">Meetings</a><a href="classes.html">Courses</a><a href="my-learning.html">My Learning</a><a class="active" href="friends.html">Friends</a><a href="chat.html">Chat</a><a href="profile.html">Profile</a><a href="settings.html">Settings</a></nav><div class="top-actions"><a class="avatar" href="profile.html" aria-label="Open profile">J</a></div></div></header>
<nav class="bottom-nav" aria-label="Mobile navigation"><a href="index.html"><span>⌂</span>Home</a><a href="meetings.html"><span>▣</span>Meetings</a><a href="classes.html"><span>▤</span>Courses</a><a class="active" href="friends.html"><span>♧</span>Friends</a><a href="chat.html"><span>✉</span>Chat</a></nav>
<main class="page"><div class="page-heading"><div><div class="eyebrow">Build your community</div><h1>People & follows</h1><p class="subtitle">Discover JOINT members and manage your follow connections.</p></div></div>
<div id="people-status" class="people-message" role="status">Connecting to JOINT…</div>
<div class="people-tools"><input id="people-search" class="search" type="search" placeholder="Search members by name or username" aria-label="Search members"></div>
<div class="people-tabs" role="tablist"><button type="button" class="active" data-view="discover">Discover</button><button type="button" data-view="following">Following <span id="following-count">0</span></button><button type="button" data-view="followers">Followers <span id="followers-count">0</span></button></div>
<div id="people-grid" class="people-grid"><div class="card muted">Loading members…</div></div>
</main><footer class="footer">JOINT · Learn, connect, and grow together</footer>
<script src="navigation.js"></script><script src="supabase.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let client,user,profiles=[],followRows=[],view='discover',busy=new Set();const status=(msg,bad=false)=>{const n=$('people-status');n.textContent=msg;n.style.background=bad?'#fff0f0':'#f5f0ff';n.style.color=bad?'#922':'#55476c'};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const followsId=id=>followRows.some(r=>r.follower_id===user.id&&r.followed_user_id===id);const initials=name=>String(name||'J').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'J';
async function load(){try{client=await window.jointSupabaseConnection;const {data,error}=await client.auth.getUser();if(error)throw error;user=data.user;if(!user){status('Please sign in to discover members and manage follows.',true);$('people-grid').innerHTML='<div class="people-empty">Sign in to see JOINT members.</div>';return}const [pr,fr]=await Promise.all([client.from('joint_profiles').select('id,username,display_name,bio,avatar_url,account_type').neq('id',user.id).order('display_name',{ascending:true}).limit(200),client.from('joint_follows').select('follower_id,followed_user_id')]);if(pr.error)throw pr.error;if(fr.error)throw fr.error;profiles=pr.data||[];followRows=fr.data||[];updateCounts();status('Members and follow relationships are loaded from Supabase.');render()}catch(e){console.error('JOINT people page:',e);status('Could not load members: '+(e.message||'Check Supabase access and RLS policies.'),true);$('people-grid').innerHTML='<div class="people-empty">Member list unavailable. Refresh after checking the Supabase joint_profiles and joint_follows SELECT policies.</div>'}}
function updateCounts(){$('following-count').textContent=followRows.filter(r=>r.follower_id===user.id).length;$('followers-count').textContent=followRows.filter(r=>r.followed_user_id===user.id).length}
function currentPeople(){const q=$('people-search').value.trim().toLowerCase();let list=profiles;if(view==='following'){const ids=new Set(followRows.filter(r=>r.follower_id===user.id).map(r=>r.followed_user_id));list=profiles.filter(p=>ids.has(p.id))}else if(view==='followers'){const ids=new Set(followRows.filter(r=>r.followed_user_id===user.id).map(r=>r.follower_id));list=profiles.filter(p=>ids.has(p.id))}return list.filter(p=>!q||[p.display_name,p.username,p.bio,p.account_type].some(x=>String(x||'').toLowerCase().includes(q)))}
function render(){const root=$('people-grid');root.replaceChildren();const list=currentPeople();if(!list.length){const e=document.createElement('div');e.className='people-empty';e.textContent=view==='following'?'You are not following any members yet.':view==='followers'?'No followers to show yet.':'No members match your search.';root.append(e);return}list.forEach(p=>{const card=document.createElement('article');card.className='person-card';const head=document.createElement('div');head.className='person-head';const profileLink=document.createElement('a');profileLink.href='member-profile.html?id='+encodeURIComponent(p.id);profileLink.className='person-profile-link';profileLink.style.cssText='display:flex;gap:12px;align-items:center;min-width:0;flex:1;color:inherit;text-decoration:none';const avatar=document.createElement('div');avatar.className='person-avatar';if(p.avatar_url){const img=document.createElement('img');img.src=p.avatar_url;img.alt=(p.display_name||'Member')+' profile picture';img.loading='lazy';avatar.append(img)}else avatar.textContent=initials(p.display_name);const info=document.createElement('div');info.style.minWidth='0';const name=document.createElement('h3');name.className='person-name';name.textContent=p.display_name||'JOINT member';const meta=document.createElement('p');meta.className='person-meta';meta.textContent=(p.username?'@'+p.username+' · ':'')+(p.account_type||'Member');info.append(name,meta);profileLink.append(avatar,info);head.append(profileLink);card.append(head);if(p.bio){const bio=document.createElement('p');bio.className='person-bio';bio.textContent=p.bio;card.append(bio)}const fcount=followRows.filter(r=>r.followed_user_id===p.id).length;const count=document.createElement('p');count.className='people-count';count.textContent=fcount+' follower'+(fcount===1?'':'s');card.append(count);const b=document.createElement('button');b.type='button';b.className='person-action'+(followsId(p.id)?' following':'');b.textContent=followsId(p.id)?'✓ Following':'⭐ Follow';b.disabled=busy.has(p.id);b.onclick=()=>toggleFollow(p.id,b);card.append(b);root.append(card)})}
async function toggleFollow(id,button){if(busy.has(id))return;busy.add(id);button.disabled=true;try{const existing=followRows.find(r=>r.follower_id===user.id&&r.followed_user_id===id);let result;if(existing){result=await client.from('joint_follows').delete().eq('follower_id',user.id).eq('followed_user_id',id)}else{result=await client.from('joint_follows').insert({follower_id:user.id,followed_user_id:id})}if(result.error)throw result.error;const refreshed=await client.from('joint_follows').select('follower_id,followed_user_id');if(refreshed.error)throw refreshed.error;followRows=refreshed.data||[];updateCounts();render();status(existing?'You unfollowed this member.':'You are now following this member.')}catch(e){console.error(e);status('Could not update follow: '+e.message,true);button.disabled=false}finally{busy.delete(id)}}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()}));$('people-search').addEventListener('input',render);load();})();
</script><script src="operation-loading-bar.js" defer></script>
</body></html>
