<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payout monitoring — JOINT Admin</title><link rel="stylesheet" href="style.css"><style>.page{max-width:1100px;margin:auto;padding:24px 14px 100px}.panel{background:#fff;border:1px solid #e5deef;border-radius:16px;padding:18px;margin:14px 0}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.filters input,.filters select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ddd5e9;border-radius:10px;font:inherit}.row{border-top:1px solid #eee5f5;padding:14px 0;overflow-wrap:anywhere}.muted{color:#777486;line-height:1.5}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#f0e8ff;color:#5424b5;font-weight:700}.status{padding:12px;background:#f0e8ff;border-radius:10px}</style></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="admin.html"><span class="brand-mark">J</span> JOINT Admin</a><nav class="main-nav"><a href="admin.html">Dashboard</a><a href="admin-payments.html">Payments</a></nav><button id="admin-signout" class="btn secondary">Sign out</button></div></header><main class="page"><h1>Payout monitoring</h1><p class="muted">Track requested and automatic payout preferences and payout statuses for hosting accounts. This dashboard does not itself transfer funds.</p><div id="status" class="status">Verifying administrator…</div><section class="panel"><div class="filters"><div><label for="state">Payout status / mode</label><select id="state"><option value="all">All payouts</option><option>requested</option><option>automatic</option><option>pending</option><option>paid</option><option>declined</option><option>cancelled</option></select></div><div><label for="search">Search school, institute, owner or email</label><input id="search" placeholder="Search payouts"></div></div><div id="rows"></div></section></main><script src="supabase.js"></script><script src="admin-auth.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let db,all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function say(t,bad=false){$('status').textContent=t;$('status').style.background=bad?'#fff0f0':'#f0e8ff'}function render(){const f=$('state').value,q=$('search').value.trim().toLowerCase();const rows=all.filter(x=>(f==='all'||String(x.status||x.payout_mode||'pending').toLowerCase()===f)&&JSON.stringify(x).toLowerCase().includes(q));$('rows').innerHTML=rows.map(x=>'<article class="row"><strong>'+esc(x.school_name||x.institute_name||x.organization_name||x.host_name||x.owner_username||'JOINT host')+'</strong> <span class="pill">'+esc(x.status||x.payout_mode||'pending')+'</span><p>'+esc(x.owner_username||x.username||'')+' · '+esc(x.owner_email||x.email||'Email not recorded')+'</p><p class="muted">'+esc(x.currency||'')+' '+Number(x.amount||x.amount_requested||0).toLocaleString()+' · '+esc(x.payout_method||x.method_label||'Receiving method not recorded')+' · '+esc(x.created_at?new Date(x.created_at).toLocaleString():'Not recorded')+'</p><p><a class="btn secondary" href="member-profile.html?id='+encodeURIComponent(x.owner_id||x.user_id||'')+'">View host profile</a> '+(x.owner_id||x.user_id?'<a class="btn secondary" href="conversation.html?user='+encodeURIComponent(x.owner_id||x.user_id)+'">Message host</a>':'')+'</p></article>').join('')||'<p class="muted">No matching payout records.</p>'}document.addEventListener('joint-admin-authorized',async ev=>{db=ev.detail.db;try{const r=await db.from('joint_payout_requests').select('*').order('created_at',{ascending:false}).limit(1000);if(r.error)throw r.error;all=r.data||[];render();say('Loaded '+all.length+' payout records.');}catch(e){say('Payout records are unavailable: '+e.message+'. Check the table name and policies, then connect the payout workflow to record verified payout events.',true)}});$('state').onchange=render;$('search').oninput=render;$('admin-signout').onclick=async()=>{try{if(db)await db.auth.signOut()}finally{location.replace('admin-login.html')}}})();
</script></body></html>
