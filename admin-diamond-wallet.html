<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diamond Wallet Admin — JOINT</title><link rel="stylesheet" href="style.css"><style>.page{max-width:1150px;margin:auto;padding:24px 14px 100px}.panel{background:#fff;border:1px solid #e5deef;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.page input,.page select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ddd5e9;border-radius:10px;font:inherit;margin:5px 0 12px}.page button{padding:11px 15px;border:0;border-radius:10px;background:#6938d1;color:white;font-weight:800;cursor:pointer}.row{border-top:1px solid #eee5f5;padding:15px 0;overflow-wrap:anywhere}.muted{color:#777486}.status{padding:12px;background:#f0e8ff;border-radius:10px;white-space:pre-wrap}</style></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="admin.html"><span class="brand-mark">J</span> JOINT Admin</a><nav class="main-nav"><a href="admin.html">Dashboard</a></nav><button id="signout" class="btn secondary">Sign out</button></div></header><main class="page"><h1>Diamond wallet administration</h1><div id="status" class="status">Verifying administrator…</div><section class="panel"><h2>Approved payout methods</h2><form id="method-form" class="grid"><div><label>Method label</label><input id="label" required placeholder="Bank transfer"></div><div><label>Country code (optional)</label><input id="country" placeholder="NG"></div><div><label>Currency</label><input id="currency" required placeholder="NGN"></div><div><label>Receiving duration</label><input id="duration" placeholder="1–3 business days"></div><div><label>Payout day/date rule</label><input id="schedule" placeholder="Weekdays / 25th monthly"></div><div><label>Deduction rate (%)</label><input id="rate" type="number" min="0" max="100" step="0.01" value="0" required></div><div><label>Fixed fee (optional)</label><input id="fee" type="number" min="0" step="0.01" value="0"></div><div><label>Active</label><select id="active"><option value="true">Yes</option><option value="false">No</option></select></div></form><button id="add-method">Add payout method</button><div id="methods"></div></section><section class="panel"><h2>Payout requests</h2><p class="muted">Mark a request paid only after the transfer is actually completed. Attach a receipt URL/reference for the member to verify.</p><div id="payouts">Loading…</div></section><section class="panel"><h2>Platform transaction fee</h2><form id="fee-form" class="grid"><div><label>Default fee percentage</label><input id="platform-fee" type="number" min="0" max="100" step="0.01" value="0"></div><div><label>Fee applies to</label><select id="fee-scope"><option value="all">All eligible payments and gifts</option><option value="payments">Payments only</option><option value="gifts">Gifts only</option></select></div></form><button id="save-fee">Save fee settings</button></section></main><script src="supabase.js"></script><script src="admin-auth.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let db;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function say(s,bad=false){$('status').textContent=s;$('status').style.background=bad?'#fff0f0':'#f0e8ff'}async function refresh(){const [m,p,f]=await Promise.all([db.from('joint_payout_methods').select('*').order('created_at',{ascending:false}),db.from('joint_diamond_payout_requests').select('*').order('created_at',{ascending:false}).limit(500),db.from('joint_platform_fee_settings').select('*').limit(1)]);if(m.error)throw m.error;if(p.error)throw p.error;$('methods').innerHTML=(m.data||[]).map(x=>'<article class="row"><strong>'+esc(x.label)+'</strong> · '+esc(x.currency)+' · '+esc(x.country_code||'all countries')+' · '+(x.active?'active':'inactive')+'<div class="muted">Fee '+Number(x.deduction_percent||0)+'% + '+Number(x.fixed_fee||0)+' · '+esc(x.payout_schedule||'schedule not set')+' · '+esc(x.receiving_duration||'duration not set')+'</div></article>').join('')||'<p class="muted">No payout methods configured.</p>';$('payouts').innerHTML=(p.data||[]).map(x=>'<article class="row"><strong>'+esc(x.user_id)+'</strong> · '+esc(x.status)+'<p>'+Number(x.diamond_amount||0).toLocaleString()+' 💎 · '+esc(x.currency||'')+' · '+esc(x.method_label||x.payout_method_id||'method')+'</p><p class="muted">Details: '+esc(x.payout_details||'')+' · Requested: '+esc(x.created_at?new Date(x.created_at).toLocaleString():'')+'</p><label>Payment receipt URL / reference</label><input id="receipt-'+esc(x.id)+'" placeholder="Receipt URL or bank reference" value="'+esc(x.receipt_url||'')+'"><div class="grid"><button data-payout="'+esc(x.id)+'" data-state="approved">Approve & attach receipt</button><button data-payout="'+esc(x.id)+'" data-state="failed">Mark failed</button></div></article>').join('')||'<p class="muted">No payout requests.</p>';if(!f.error&&f.data?.[0]){$('platform-fee').value=f.data[0].fee_percent??0;$('fee-scope').value=f.data[0].fee_scope||'all'}}document.addEventListener('joint-admin-authorized',async ev=>{db=ev.detail.db;try{await refresh();say('Admin access verified.')}catch(e){say('Admin data unavailable: '+e.message+'. Apply supabase/migrations/20261025_diamond_wallet.sql first.',true)}});$('add-method').onclick=async()=>{try{const r=await db.from('joint_payout_methods').insert({label:$('label').value.trim(),country_code:$('country').value.trim().toUpperCase()||null,currency:$('currency').value.trim().toUpperCase(),receiving_duration:$('duration').value.trim()||null,payout_schedule:$('schedule').value.trim()||null,deduction_percent:Number($('rate').value),fixed_fee:Number($('fee').value),active:$('active').value==='true'});if(r.error)throw r.error;await refresh();say('Payout method saved.')}catch(e){say('Could not save method: '+e.message,true)}};$('payouts').addEventListener('click',async ev=>{const b=ev.target.closest('button[data-payout]');if(!b)return;const id=b.dataset.payout,state=b.dataset.state,receipt=$('receipt-'+id).value.trim();if(state==='approved'&&!receipt)return say('Add a receipt URL or reference before approving.',true);try{const r=await db.from('joint_diamond_payout_requests').update({status:state,receipt_url:receipt||null,processed_at:new Date().toISOString(),processed_by:(await db.auth.getUser()).data.user.id}).eq('id',id).eq('status','pending');if(r.error)throw r.error;await refresh();say('Payout updated.')}catch(e){say('Could not update payout: '+e.message,true)}});$('save-fee').onclick=async()=>{try{const q=await db.from('joint_platform_fee_settings').select('id').limit(1).maybeSingle();if(q.error)throw q.error;const payload={fee_percent:Number($('platform-fee').value),fee_scope:$('fee-scope').value,updated_at:new Date().toISOString()};const r=q.data?await db.from('joint_platform_fee_settings').update(payload).eq('id',q.data.id):await db.from('joint_platform_fee_settings').insert(payload);if(r.error)throw r.error;say('Platform fee settings saved.')}catch(e){say('Could not save fee: '+e.message,true)}};$('signout').onclick=async()=>{if(db)await db.auth.signOut();location.replace('admin-login.html')};})();
</script></body></html>
