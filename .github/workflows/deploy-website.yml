name: Deploy JOINT Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish JOINT website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare website files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site

          # Publish the static website only. Keep Android source, Supabase
          # functions, and the media-processing service out of the Pages artifact.
          rsync -a ./ site/ \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/android/' \
            --exclude='/supabase/' \
            --exclude='/media-processor/' \
            --exclude='/site/' \
            --exclude='/.*' \
            --exclude='/README.md'

          test -f site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
