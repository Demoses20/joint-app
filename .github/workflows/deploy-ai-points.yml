name: Deploy JOINT AI Points Edge Function

'on':
  push:
    branches:
      - main
    paths:
      - 'supabase/supabase/functions/joint-ai-points-/**'
      - '.github/workflows/deploy-ai-points.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-ai-points:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required GitHub secrets
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_PROJECT_ID"
            exit 1
          fi

      - name: Verify function files
        working-directory: ./supabase
        shell: bash
        run: |
          echo "Checking Supabase function directory..."
          pwd
          ls -la supabase/functions/joint-ai-points-/
          test -f supabase/functions/joint-ai-points-/index.ts

      - name: Deploy AI Points Edge Function
        working-directory: ./supabase
        run: |
          supabase functions deploy joint-ai-points- \
            --project-ref "$SUPABASE_PROJECT_ID"
