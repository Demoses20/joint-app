name: Deploy JOINT AI Points Edge Function

'on':
push:
branches:
- main
paths:
- 'supabase/supabase/functions/joint-ai-points-/**'
- '.github/workflows/deploy-ai-points.yml'
workflow_dispatch:

permissions:
contents: read

jobs:
deploy-ai-points:
runs-on: ubuntu-latest

steps:
  - name: Check out repository
    uses: actions/checkout@v4

  - name: Set up Supabase CLI
    uses: supabase/setup-cli@v1
    with:
      version: latest

  - name: Deploy AI Points Edge Function
    working-directory: ./supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    run: |
      if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
        echo "Required Supabase secrets are missing."
        exit 1
      fi
      supabase functions deploy joint-ai-points- --project-ref "$SUPABASE_PROJECT_ID"
