name: JOINT Android Build

on:
  push:
    branches:
      - android-packaging
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JOINT Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout android-packaging branch
        uses: actions/checkout@v4
        with:
          ref: android-packaging

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Preserve the existing debug APK build
      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: joint-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # Decode the private signing key on the temporary runner
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JOINT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          KEYSTORE_FILE="$RUNNER_TEMP/joint-upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          echo "JOINT_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      # Build the signed Google Play App Bundle
      - name: Build signed release AAB
        env:
          JOINT_KEYSTORE_PASSWORD: ${{ secrets.JOINT_KEYSTORE_PASSWORD }}
          JOINT_KEY_ALIAS: ${{ secrets.JOINT_KEY_ALIAS }}
          JOINT_KEY_PASSWORD: ${{ secrets.JOINT_KEY_PASSWORD }}
        run: gradle -p android bundleRelease

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: joint-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/joint-upload-key.jks"
