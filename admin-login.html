<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrator sign in — JOINT</title><link rel="stylesheet" href="style.css"><style>.login-wrap{max-width:520px;margin:30px auto;padding:18px 16px 90px}.login-card{background:#fff;border:1px solid #e7e0f0;border-radius:18px;padding:24px}.login-card label{display:block;font-weight:700;margin:15px 0 7px}.login-card input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #dcd6e8;border-radius:10px;font:inherit}.login-card button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:10px;background:#6938d1;color:white;font:inherit;font-weight:700}.msg{padding:12px;border-radius:10px;background:#f5f0ff;overflow-wrap:anywhere}.hint{color:#716c7d}</style></head>
<body><header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html"><span class="brand-mark">J</span> JOINT</a></div></header><main class="login-wrap"><div class="eyebrow">SECURE ADMIN ACCESS</div><h1>Administrator sign in</h1><p class="subtitle">Sign in with the administrator account to manage school applications.</p><section class="login-card"><form id="admin-login-form"><label for="email">Administrator email</label><input id="email" type="email" autocomplete="username" required value="technicaldemoses@gmail.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Sign in to Owner Admin</button><p id="message" class="msg" role="status" hidden></p></form></section></main><script src="supabase.js"></script><script>
(async()=>{'use strict';const form=document.getElementById('admin-login-form'),msg=document.getElementById('message'),btn=document.getElementById('submit');const show=t=>{msg.hidden=false;msg.textContent=t};try{const db=await window.jointSupabaseConnection;const params=new URLSearchParams(location.search);const next=params.get('next')==='admin-school-applications.html'?'admin-school-applications.html':'admin.html';const {data}=await db.auth.getUser();if(data.user&&(data.user.email||'').toLowerCase()==='technicaldemoses@gmail.com'){location.replace(next);return}form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Signing in…';msg.hidden=true;const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;if(email!=='technicaldemoses@gmail.com'){show('This email is not the configured administrator account.');btn.disabled=false;btn.textContent='Sign in to Owner Admin';return}const {data,error}=await db.auth.signInWithPassword({email,password});if(error){show('Sign-in failed: '+error.message);btn.disabled=false;btn.textContent='Sign in to Owner Admin';return}if((data.user?.email||'').toLowerCase()!=='technicaldemoses@gmail.com'){await db.auth.signOut();show('This account is not authorized for administration.');btn.disabled=false;btn.textContent='Sign in to Owner Admin';return}location.replace(next)});}catch(e){show('Unable to connect to JOINT authentication. Refresh and try again.')}})();
</script></body></html>
