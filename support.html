<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6938d1"><title>JOINT Support</title><link rel="stylesheet" href="style.css"><style>.sp{max-width:900px;margin:auto;padding:28px 18px 110px}.sp-card{background:#fff;border:1px solid #e5deef;border-radius:20px;padding:20px;margin:18px 0}.sp label{display:block;font-weight:700;margin:12px 0 6px}.sp input,.sp textarea,.sp select{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ddd6e9;border-radius:12px;font:inherit}.sp button{background:#6938d1;color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800}.sp button:disabled{opacity:.5}.sp-status{padding:12px;border-radius:12px;background:#f0e8ff;white-space:pre-wrap}.sp-item{border-top:1px solid #eee7f5;padding:14px 0}.sp-meta{color:#777084;font-size:.9rem}.sp-thread{background:#faf8fd;border-radius:12px;padding:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.sp-thread.admin{background:#f0e8ff}.sp [hidden]{display:none!important}</style></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html"><span class="brand-mark">J</span> JOINT</a><nav class="main-nav"><a href="index.html">Home</a><a href="settings.html">Settings</a><a href="diamond-wallet.html">Diamond Wallet</a></nav></div></header><nav class="bottom-nav"><a href="index.html"><span>⌂</span>Home</a><a href="meetings.html"><span>▣</span>Meetings</a><a href="classes.html"><span>▤</span>Courses</a><a href="friends.html"><span>♧</span>Friends</a><a href="chat.html"><span>✉</span>Chat</a></nav><main class="sp"><a href="settings.html">← Settings</a><h1>JOINT Support</h1><p>Send a message to the JOINT support team. You can return here to read replies and continue the conversation.</p><div id="sp-status" class="sp-status" role="status">Connecting…</div><section class="sp-card"><h2>New support request</h2><form id="sp-new"><label for="sp-category">What do you need help with?</label><select id="sp-category"><option>Account access</option><option>Diamond Wallet or transfer</option><option>Payment or payout</option><option>Courses or learning</option><option>Meetings or live streaming</option><option>Report a problem</option><option>Other</option></select><label for="sp-subject">Subject</label><input id="sp-subject" maxlength="140" required placeholder="Briefly describe the issue"><label for="sp-message">Message</label><textarea id="sp-message" rows="5" maxlength="5000" required placeholder="Explain what happened. Do not include your password or wallet PIN."></textarea><p><button type="submit">Send to JOINT Support</button></p></form></section><section class="sp-card"><h2>Your support requests</h2><div id="sp-list">Loading your requests…</div></section></main><script src="supabase.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let db,user,activeTicket=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function say(t,bad=false){$('sp-status').textContent=t;$('sp-status').style.background=bad?'#fff0f0':'#f0e8ff'}
async function load(){const r=await db.from('joint_support_tickets').select('id,subject,category,status,created_at,updated_at').eq('user_id',user.id).order('updated_at',{ascending:false}).limit(50);if(r.error)throw r.error;$('sp-list').innerHTML=(r.data||[]).map(t=>`<article class="sp-item"><strong>${esc(t.subject)}</strong> · ${esc(t.status)}<div class="sp-meta">${esc(t.category)} · ${new Date(t.created_at).toLocaleString()}</div><button type="button" data-ticket="${esc(t.id)}">Open conversation</button></article>`).join('')||'<p>You have not contacted support yet.</p>'}
async function thread(id){activeTicket=id;const [t,m]=await Promise.all([db.from('joint_support_tickets').select('id,subject,status').eq('id',id).eq('user_id',user.id).single(),db.from('joint_support_messages').select('id,sender_role,message,created_at').eq('ticket_id',id).order('created_at')]);if(t.error)throw t.error;if(m.error)throw m.error;const box=document.createElement('section');box.className='sp-card';box.id='sp-active-thread';box.innerHTML=`<h2>${esc(t.data.subject)} · ${esc(t.data.status)}</h2><div>${(m.data||[]).map(x=>`<div class="sp-thread ${x.sender_role==='admin'?'admin':''}"><strong>${x.sender_role==='admin'?'JOINT Support':'You'}</strong><div>${esc(x.message)}</div><small class="sp-meta">${new Date(x.created_at).toLocaleString()}</small></div>`).join('')}</div><form id="sp-reply"><label for="sp-reply-text">Reply</label><textarea id="sp-reply-text" rows="3" maxlength="5000" required></textarea><p><button type="submit">Send reply</button></p></form>`;document.getElementById('sp-active-thread')?.remove();$('sp-list').after(box);$('sp-reply').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const x=await db.from('joint_support_messages').insert({ticket_id:id,user_id:user.id,sender_role:'user',message:$('sp-reply-text').value.trim()});if(x.error)throw x.error;await thread(id);await load();say('Your reply was sent.')}catch(err){say('Could not send reply: '+err.message,true)}finally{b.disabled=false}}}
(async()=>{try{db=await window.jointSupabaseConnection;const a=await db.auth.getUser();if(a.error)throw a.error;user=a.data?.user;if(!user)throw new Error('Please sign in to contact JOINT Support.');const pr=await db.from('joint_profiles').select('display_name,username,avatar_url').eq('id',user.id).maybeSingle();if(!pr.error)user.jointProfile=pr.data||{};await load();say('Support is ready.')}catch(e){say(e.message,true)}})();$('sp-new').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{if(!db||!user)throw new Error('Please sign in again.');const subject=$('sp-subject').value.trim(),message=$('sp-message').value.trim();const profile=user.jointProfile||{};const r=await db.from('joint_support_tickets').insert({user_id:user.id,customer_email:user.email||null,customer_name:profile.display_name||user.user_metadata?.display_name||user.user_metadata?.full_name||null,customer_username:profile.username||null,customer_avatar_url:profile.avatar_url||null,subject,category:$('sp-category').value,status:'open'}).select('id').single();if(r.error)throw r.error;const m=await db.from('joint_support_messages').insert({ticket_id:r.data.id,user_id:user.id,sender_role:'user',message});if(m.error)throw m.error;$('sp-new').reset();await load();await thread(r.data.id);say('Your support request has been sent.')}catch(err){say('Could not send request: '+err.message,true)}finally{b.disabled=false}};$('sp-list').addEventListener('click',e=>{const b=e.target.closest('[data-ticket]');if(b)thread(b.dataset.ticket).catch(err=>say(err.message,true))});})();
</script></body></html>
