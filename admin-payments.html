<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments & subscriptions — JOINT Admin</title><link rel="stylesheet" href="style.css"><style>.page{max-width:1100px;margin:auto;padding:24px 14px 100px}.panel{background:#fff;border:1px solid #e5deef;border-radius:16px;padding:18px;margin:14px 0}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.filters input,.filters select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ddd5e9;border-radius:10px;font:inherit}.row{border-top:1px solid #eee5f5;padding:14px 0;overflow-wrap:anywhere}.muted{color:#777486;line-height:1.5}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#f0e8ff;color:#5424b5;font-weight:700}.status{padding:12px;background:#f0e8ff;border-radius:10px}</style></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="admin.html"><span class="brand-mark">J</span> JOINT Admin</a><nav class="main-nav"><a href="admin.html">Dashboard</a><a href="admin-payouts.html">Payouts</a></nav><button id="admin-signout" class="btn secondary">Sign out</button></div></header><main class="page"><h1>Payments & subscriptions</h1><p class="muted">Review payment records and subscriptions across JOINT. This view only shows transactions recorded by the configured payment backend.</p><div id="status" class="status">Verifying administrator…</div><section class="panel"><div class="filters"><div><label for="state">Payment status</label><select id="state"><option value="all">All statuses</option><option>paid</option><option>pending</option><option>declined</option><option>cancelled</option><option>refunded</option></select></div><div><label for="search">Search payee, email, school or course</label><input id="search" placeholder="Search payments"></div></div><div id="rows"></div></section></main><script src="supabase.js"></script><script src="admin-auth.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let db,all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function say(t,bad=false){$('status').textContent=t;$('status').style.background=bad?'#fff0f0':'#f0e8ff'}function render(){const f=$('state').value,q=$('search').value.trim().toLowerCase();const rows=all.filter(x=>(f==='all'||String(x.status||'pending').toLowerCase()===f)&&JSON.stringify(x).toLowerCase().includes(q));$('rows').innerHTML=rows.map(x=>'<article class="row"><strong>'+esc(x.payee_username||x.username||x.payer_name||'JOINT member')+'</strong> <span class="pill">'+esc(x.status||'pending')+'</span><p>'+esc(x.payee_email||x.email||'Email not recorded')+'</p><p class="muted">'+esc(x.currency||'')+' '+Number(x.amount||0).toLocaleString()+' · '+esc(x.payment_type||x.kind||x.description||'Payment')+' · '+esc(x.school_name||x.course_title||x.item_name||'JOINT')+'</p><p class="muted">Date: '+esc(x.created_at?new Date(x.created_at).toLocaleString():'Not recorded')+' · Transaction: '+esc(x.reference||x.transaction_id||x.id)+'</p><p><a class="btn secondary" href="member-profile.html?id='+encodeURIComponent(x.payee_id||x.user_id||'')+'">＋ Payee profile</a> '+(x.owner_id||x.school_owner_id?'<a class="btn secondary" href="member-profile.html?id='+encodeURIComponent(x.owner_id||x.school_owner_id)+'">School/course admin profile</a>':'')+'</p></article>').join('')||'<p class="muted">No matching payment records.</p>'}document.addEventListener('joint-admin-authorized',async ev=>{db=ev.detail.db;try{const r=await db.from('joint_payment_transactions').select('*').order('created_at',{ascending:false}).limit(1000);if(r.error)throw r.error;all=r.data||[];render();say('Loaded '+all.length+' payment records.');}catch(e){say('Payment records are unavailable: '+e.message+'. Check the table name and SELECT policies, then connect the checkout backend to record verified payment-provider events.',true)}});$('state').onchange=render;$('search').oninput=render;$('admin-signout').onclick=async()=>{try{if(db)await db.auth.signOut()}finally{location.replace('admin-login.html')}}})();
</script><script src="operation-loading-bar.js" defer></script>
</body></html>
