<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promotion controls — JOINT Admin</title><link rel="stylesheet" href="style.css"><style>.page{max-width:1100px;margin:auto;padding:24px 14px 100px}.panel{background:#fff;border:1px solid #e5deef;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd5e9;border-radius:10px;font:inherit}.status{padding:12px;border-radius:10px;background:#f0e8ff;line-height:1.5}.row{padding:12px 0;border-top:1px solid #eee;overflow-wrap:anywhere}.muted{color:#777486;line-height:1.5}</style></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="admin.html"><span class="brand-mark">J</span> JOINT Admin</a><nav class="main-nav"><a href="admin.html">Dashboard</a><a href="admin-school-applications.html">Hosting applications</a></nav><button id="admin-signout" class="btn secondary">Sign out</button></div></header><main class="page"><h1>Promotion pricing & monitoring</h1><p class="muted">Manage the advertised estimates by country and currency, and review submitted campaigns. Pricing changes affect future estimates only.</p><div id="status" class="status">Verifying administrator…</div><section class="panel"><h2>Add or update a rate card</h2><form id="rate-form"><div class="grid"><div class="field"><label for="country">Country (* = default)</label><input id="country" value="*" required></div><div class="field"><label for="state-region">State / region (* = any)</label><input id="state-region" value="*" required></div><div class="field"><label for="currency">Currency code</label><input id="currency" value="NGN" maxlength="3" required></div><div class="field"><label for="cpm">Cost per 1,000 impressions (CPM)</label><input id="cpm" type="number" min="0.01" step="0.01" value="1000" required></div><div class="field"><label for="cpc">Cost per click (CPC)</label><input id="cpc" type="number" min="0.01" step="0.01" value="100" required></div><div class="field"><label for="cpv">Cost per video view (CPV)</label><input id="cpv" type="number" min="0.01" step="0.01" value="50" required></div></div><p><button class="btn" type="submit">Save rate card</button></p></form><div id="rates"></div></section><section class="panel"><h2>Promotion campaigns</h2><div class="grid"><div class="field"><label for="status-filter">Status</label><select id="status-filter"><option value="all">All statuses</option><option>draft</option><option>awaiting_payment</option><option>pending_review</option><option>active</option><option>paused</option><option>payment_verified</option><option>completed</option><option>rejected</option></select></div><div class="field"><label for="campaign-search">Search</label><input id="campaign-search" placeholder="School, course or owner"></div></div><div id="campaigns"></div></section></main><script src="supabase.js"></script><script src="admin-auth.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let db,all=[],allEvents=[];const ADMIN='technicaldemoses@gmail.com';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function say(t,bad=false){$('status').textContent=t;$('status').style.background=bad?'#fff0f0':'#f0e8ff'}async function loadRates(){const r=await db.from('joint_promotion_rates').select('*').order('country').order('currency');if(r.error)throw r.error;$('rates').innerHTML=(r.data||[]).map(x=>'<div class="row"><strong>'+esc(x.country)+' / '+esc(x.state_region||'*')+' · '+esc(x.currency)+'</strong><p class="muted">CPM '+x.cpm+' · CPC '+x.cpc+' · CPV '+x.cpv+' · '+(x.is_active?'Active':'Inactive')+'</p></div>').join('')||'<p class="muted">No rate cards configured.</p>'}function renderCampaigns(){const f=$('status-filter').value,s=$('campaign-search').value.toLowerCase();const arr=all.filter(x=>(f==='all'||x.status===f)&&JSON.stringify(x).toLowerCase().includes(s));$('campaigns').innerHTML=arr.map(c=>'<div class="row"><strong>'+esc(c.name||'Promotion')+'</strong> <span class="pill">'+esc(c.status)+'</span><p class="muted">Owner: '+esc(c.owner_id)+' · Budget: '+esc(c.currency)+' '+Number(c.budget||0).toLocaleString()+' · Estimated impressions '+Number(c.estimated_impressions||0).toLocaleString()+' · clicks '+Number(c.estimated_clicks||0).toLocaleString()+'</p><p class="muted">Actual events: '+allEvents.filter(e=>e.promotion_id===c.id&&e.event_type==='impression').length+' impressions · '+allEvents.filter(e=>e.promotion_id===c.id&&e.event_type==='click').length+' clicks · '+allEvents.filter(e=>e.promotion_id===c.id&&e.event_type==='view').length+' views · '+allEvents.filter(e=>e.promotion_id===c.id&&['join','enrollment'].includes(e.event_type)).length+' joins/enrolments</p><div class="actions"><button class="btn secondary" data-id="'+esc(c.id)+'" data-status="pending_review">Mark for review</button><button class="btn" data-id="'+esc(c.id)+'" data-status="active">Activate (only after verified payment)</button><button class="btn ghost" data-id="'+esc(c.id)+'" data-status="rejected">Reject</button></div></div>').join('')||'<p class="muted">No matching campaigns.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{const c=all.find(x=>x.id===b.dataset.id);if(b.dataset.status==='active'&&c.status!=='paid'&&c.status!=='payment_verified'){alert('Do not activate this campaign until a verified payment record exists. This page does not itself charge money.');return}const {error}=await db.from('joint_promotions').update({status:b.dataset.status,updated_at:new Date().toISOString()}).eq('id',b.dataset.id);if(error){say('Could not update campaign: '+error.message,true);return}await loadCampaigns();say('Campaign status updated.')})}async function loadCampaigns(){const r=await db.from('joint_promotions').select('*').order('created_at',{ascending:false}).limit(500);if(r.error)throw r.error;all=r.data||[];const ids=all.map(x=>x.id);if(ids.length){const er=await db.from('joint_promotion_events').select('promotion_id,event_type,country,source,created_at').in('promotion_id',ids).limit(20000);if(!er.error)allEvents=er.data||[]}renderCampaigns()}document.addEventListener('joint-admin-authorized',async ev=>{db=ev.detail.db;try{await Promise.all([loadRates(),loadCampaigns()]);say('Admin controls ready.');}catch(e){say('Could not load promotions. Run the included SQL migration: '+e.message,true)}});$('rate-form').addEventListener('submit',async e=>{e.preventDefault();if(!db){say('Admin session not ready.',true);return}const row={country:$('country').value.trim()||'*',state_region:$('state-region').value.trim()||'*',currency:$('currency').value.trim().toUpperCase(),cpm:Number($('cpm').value),cpc:Number($('cpc').value),cpv:Number($('cpv').value),is_active:true,updated_at:new Date().toISOString()};const found=await db.from('joint_promotion_rates').select('id').eq('country',row.country).eq('state_region',row.state_region).eq('currency',row.currency).maybeSingle();let r;if(found.data?.id)r=await db.from('joint_promotion_rates').update(row).eq('id',found.data.id);else r=await db.from('joint_promotion_rates').insert(row);if(r.error){say('Could not save rate card: '+r.error.message,true);return}await loadRates();say('Rate card saved.')});$('status-filter').onchange=renderCampaigns;$('campaign-search').oninput=renderCampaigns;$('admin-signout').onclick=async()=>{try{if(db)await db.auth.signOut()}finally{location.replace('admin-login.html')}}})();
</script></body></html>
