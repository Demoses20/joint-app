<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Host dashboard — JOINT</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><section class="card"><h1>Opening your JOINT hosting workspace</h1><p id="route-status">Checking your approved hosting status…</p></section></main><script src="supabase.js"></script><script>(async function(){try{const db=await window.jointSupabaseConnection;const r=await db.auth.getUser();if(r.error)throw r.error;if(!r.data.user){location.replace('auth.html?next=host-dashboard.html');return}const q=await db.from('joint_school_host_applications').select('id,owner_type,status,application_data,updated_at').eq('owner_id',r.data.user.id).eq('status','approved').order('updated_at',{ascending:false}).limit(50);if(q.error)throw q.error;const app=(q.data||[]).find(a=>a.application_data?.request_type!=='upgrade');if(app)location.replace('school-dashboard.html?application='+encodeURIComponent(app.id));else location.replace('host-school.html')}catch(e){document.getElementById('route-status').textContent='Could not verify hosting status. Please open the Host section or try again.';console.error(e)}})();</script></body></html>
