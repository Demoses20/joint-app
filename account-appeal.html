<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6938d1"><title>JOINT — Account Appeal</title><link rel="stylesheet" href="style.css"><style>.appeal-wrap{max-width:650px;margin:32px auto;padding:22px 16px}.appeal-card{background:#fff;border:1px solid #e6dff0;border-radius:18px;padding:22px}.appeal-card textarea{width:100%;min-height:150px;padding:12px;border:1px solid #d8cfe5;border-radius:12px;font:inherit}.appeal-card button{margin-top:12px;border:0;border-radius:10px;padding:12px 16px;background:#6938d1;color:#fff;font-weight:800}.status{line-height:1.6;white-space:pre-wrap}</style></head><body><main class="appeal-wrap"><section class="appeal-card"><h1>JOINT account suspended</h1><p>Your account has been suspended after reaching the community-report threshold. You may submit an appeal for an administrator to review.</p><p id="suspension-reason" class="status"></p><form id="appeal-form"><label for="appeal-message"><strong>Explain your appeal</strong></label><textarea id="appeal-message" minlength="20" maxlength="4000" required placeholder="Explain why you believe this suspension should be reviewed (at least 20 characters)."></textarea><button type="submit">Submit appeal</button></form><p id="appeal-status" class="status" role="status"></p></section></main><script src="supabase.js"></script><script>
(async()=>{const status=document.getElementById('appeal-status'),form=document.getElementById('appeal-form'),msg=document.getElementById('appeal-message');try{const db=await window.jointSupabaseConnection;const {data,error}=await db.auth.getUser();if(error||!data.user){location.replace('auth.html?next=account-appeal.html');return}const {data:p,error:pe}=await db.from('joint_profiles').select('account_status,suspension_reason,appeal_status,appeal_text').eq('id',data.user.id).maybeSingle();if(pe)throw pe;if(p?.account_status!=='suspended'){location.replace('index.html');return}document.getElementById('suspension-reason').textContent='Reason: '+(p.suspension_reason||'Community reports')+(p.appeal_status==='pending'?'\nYour appeal is awaiting admin review.':'');if(p.appeal_status==='pending'){msg.value=p.appeal_text||'';msg.disabled=true;form.querySelector('button').disabled=true;status.textContent='Your appeal has already been submitted.'}form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const {data:result,error}=await db.rpc('joint_submit_account_appeal',{p_message:msg.value.trim()});if(error)throw error;status.textContent=result?.message||'Appeal submitted.';msg.disabled=true}catch(err){status.textContent=err.message;button.disabled=false}})}catch(e){status.textContent='Could not load account appeal: '+e.message}})();
</script></body></html>
