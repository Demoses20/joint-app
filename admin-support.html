<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOINT Support Inbox</title><link rel="stylesheet" href="style.css"><style>.page{max-width:1100px;margin:auto;padding:24px 18px 80px}.panel{background:#fff;border:1px solid #e5deef;border-radius:18px;padding:20px;margin:18px 0}.row{padding:14px 0;border-top:1px solid #eee;overflow-wrap:anywhere}.muted{color:#777084}.status{padding:12px;border-radius:12px;background:#f0e8ff;white-space:pre-wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.page button{background:#6938d1;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:800}.page textarea,.page select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd6e9;border-radius:10px;font:inherit}.thread{padding:12px;border-radius:12px;background:#faf8fd;margin:9px 0;white-space:pre-wrap}.thread.user{background:#f0e8ff}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="admin.html"><span class="brand-mark">J</span> JOINT Admin</a><nav class="main-nav"><a href="admin.html">Dashboard</a><a href="admin-support.html">Support inbox</a></nav><button id="signout">Sign out</button></div></header><main class="page"><h1>Customer support inbox</h1><div id="status" class="status">Verifying administrator…</div><section class="panel"><h2>Requests</h2><label for="filter">Filter</label><select id="filter"><option value="all">All requests</option><option value="open">Open</option><option value="pending">Pending</option><option value="resolved">Resolved</option></select><div id="tickets">Loading…</div></section><section class="panel" id="conversation" hidden><h2 id="ticket-title">Conversation</h2><div id="messages"></div><label for="reply">Reply to customer</label><textarea id="reply" rows="4" maxlength="5000"></textarea><div class="grid"><button id="send-reply">Send reply</button><button id="resolve-ticket">Mark resolved</button></div></section></main><script src="supabase.js"></script><script src="admin-auth.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let db,current=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function say(s,bad=false){$('status').textContent=s;$('status').style.background=bad?'#fff0f0':'#f0e8ff'}async function refresh(){const f=$('filter').value;let q=db.from('joint_support_tickets').select('*').order('updated_at',{ascending:false}).limit(200);if(f!=='all')q=q.eq('status',f);const r=await q;if(r.error)throw r.error;$('tickets').innerHTML=(r.data||[]).map(t=>`<article class="row"><strong>${esc(t.subject)}</strong> · ${esc(t.status)}<div class="muted">${esc(t.category)} · User ${esc(t.user_id)} · ${new Date(t.created_at).toLocaleString()}</div><button data-open="${esc(t.id)}">Review and reply</button></article>`).join('')||'<p>No support requests in this view.</p>'}async function openTicket(id){current=id;const [t,m]=await Promise.all([db.from('joint_support_tickets').select('*').eq('id',id).single(),db.from('joint_support_messages').select('*').eq('ticket_id',id).order('created_at')]);if(t.error)throw t.error;if(m.error)throw m.error;$('conversation').hidden=false;$('ticket-title').textContent=t.data.subject+' · '+t.data.status+' · '+t.data.user_id;$('messages').innerHTML=(m.data||[]).map(x=>`<div class="thread ${x.sender_role==='user'?'user':''}"><strong>${x.sender_role==='admin'?'JOINT Support':'Customer'}</strong><div>${esc(x.message)}</div><small class="muted">${new Date(x.created_at).toLocaleString()}</small></div>`).join('');$('conversation').scrollIntoView({behavior:'smooth',block:'start'})}document.addEventListener('joint-admin-authorized',async e=>{db=e.detail.db;try{await refresh();say('Administrator access verified.')}catch(err){say('Could not load support inbox: '+err.message,true)}});$('filter').onchange=()=>refresh().catch(e=>say(e.message,true));$('tickets').onclick=e=>{const b=e.target.closest('[data-open]');if(b)openTicket(b.dataset.open).catch(err=>say(err.message,true))};$('send-reply').onclick=async()=>{if(!current)return;const msg=$('reply').value.trim();if(!msg)return say('Write a reply first.',true);try{const a=await db.auth.getUser();const r=await db.from('joint_support_messages').insert({ticket_id:current,user_id:a.data.user.id,sender_role:'admin',message:msg});if(r.error)throw r.error;await db.from('joint_support_tickets').update({status:'pending',updated_at:new Date().toISOString()}).eq('id',current);$('reply').value='';await openTicket(current);await refresh();say('Reply sent to customer.')}catch(e){say('Could not send reply: '+e.message,true)}};$('resolve-ticket').onclick=async()=>{if(!current)return;try{const r=await db.from('joint_support_tickets').update({status:'resolved',updated_at:new Date().toISOString()}).eq('id',current);if(r.error)throw r.error;await refresh();await openTicket(current);say('Request marked as resolved.')}catch(e){say('Could not update request: '+e.message,true)}};$('signout').onclick=async()=>{if(db)await db.auth.signOut();location.replace('admin-login.html')};})();
</script></body></html>
