<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversation — JOINT</title>
<link rel="stylesheet" href="style.css">
<style>
.jconv-wrap{max-width:850px;margin:0 auto}
.jconv-back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#6032c5;font-weight:700;margin-bottom:10px;padding:8px 0}
.jconv-card{display:flex;flex-direction:column;min-height:55vh;max-height:none;overflow:visible}
.jconv-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line,#e8e2ef)}
.jconv-avatar{width:44px;height:44px;flex:0 0 44px;border-radius:50%;object-fit:cover;background:#eee7fa;display:grid;place-items:center;font-weight:700;color:#6032c5}
.jconv-messages{flex:1;min-height:180px;max-height:65vh;overflow-y:auto;overscroll-behavior-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;padding:16px 2px}
.jconv-bubble{max-width:82%;padding:11px 14px;border-radius:16px;background:#f3eff9;overflow-wrap:anywhere;white-space:pre-wrap}.jconv-bubble .jconv-body{margin:5px 0}.jconv-message-author{display:flex;align-items:center;gap:7px;font-size:.82rem;margin-bottom:6px}.jconv-message-author a{color:inherit;text-decoration:none}.jconv-message-avatar{width:27px;height:27px;display:grid;place-items:center;flex:0 0 27px;border-radius:50%;overflow:hidden;background:#e9ddff;color:#5428a9;font-weight:800}.jconv-message-avatar img{width:100%;height:100%;object-fit:cover}.jconv-media-image{display:block;width:auto;max-width:min(100%,420px);height:auto;max-height:320px;object-fit:contain;border-radius:12px}.jconv-media-video{display:block;width:100%;max-width:min(100%,420px);height:auto;max-height:320px;aspect-ratio:16/9;object-fit:contain;background:#120d1b;border-radius:12px}.jconv-media-audio{display:block;width:min(100%,340px);margin:8px 0}.jconv-reactions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:8px;position:relative}.jconv-reaction-plus,.jconv-reaction-count,.jconv-reaction-picker button{border:0;border-radius:999px;background:#e9ddff;color:#35204e;padding:4px 8px;cursor:pointer;font-size:15px}.jconv-reaction-plus{font-weight:800}.jconv-reaction-count.mine{outline:2px solid #6335c7}.jconv-reaction-picker{display:flex;gap:3px;flex-wrap:wrap;padding:5px;border:1px solid #e1d6f1;border-radius:999px;background:#fff;box-shadow:0 4px 12px #24163a15}.jconv-reaction-picker[hidden]{display:none}.jconv-message-actions{display:flex;gap:6px;margin-top:6px}.jconv-message-actions button,.jconv-reply-composer button{border:0;border-radius:9px;padding:5px 10px;background:#eee5ff;color:#5428a9;cursor:pointer;font:inherit;font-size:.82rem}.jconv-thread{margin:8px 0 0 12px;padding-left:10px;border-left:3px solid #bba0f2}.jconv-bubble.jconv-reply{max-width:100%;padding:9px 11px;margin:7px 0;border-radius:12px;background:#f8f4ff;color:#30213f}.jconv-reply-composer{margin:8px 0 4px 12px;padding:10px;border-left:3px solid #6335c7;background:#faf7ff;border-radius:0 10px 10px 0}.jconv-reply-composer[hidden]{display:none}.jconv-reply-composer form{display:grid;gap:7px}.jconv-reply-tools{display:flex;gap:7px;flex-wrap:wrap}.jconv-reply-tools label{display:inline-flex;align-items:center;border:0;border-radius:9px;padding:5px 10px;background:#eee5ff;color:#5428a9;cursor:pointer;font-size:.82rem}.jconv-reply-composer textarea{width:100%;box-sizing:border-box;border:1px solid #dcd4e9;border-radius:10px;padding:10px;font:inherit}
.jconv-bubble.mine{align-self:flex-end;background:#f0e8ff;color:#30213f;border:1px solid #e2d3ff;border-bottom-right-radius:5px}
.jconv-bubble.theirs{align-self:flex-start;border-bottom-left-radius:5px}
.jconv-meta{display:block;font-size:.75rem;opacity:.75;margin-top:5px}
.jconv-form{display:flex;gap:9px;align-items:flex-end;border-top:1px solid var(--line,#e8e2ef);padding-top:12px;flex-wrap:wrap}.jconv-attach-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.jconv-attach-row label,.jconv-attach-row button{border:0;border-radius:11px;background:#eee5ff;color:#5428a9;padding:10px 13px;font:600 14px inherit;cursor:pointer}.jconv-attach-status{color:var(--muted,#777);min-height:1.2em}.jconv-quick-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.jconv-quick-tools button{border:0;border-radius:10px;background:#eee5ff;color:#5428a9;padding:7px 10px;font:inherit;cursor:pointer}
.jconv-input{flex:1;min-width:0;resize:vertical;max-height:120px;min-height:46px;padding:12px;border:1px solid #dcd4e9;border-radius:13px;font:inherit;box-sizing:border-box}
.jconv-send{border:0;border-radius:13px;background:#6335c7;color:white;padding:13px 18px;font-weight:700;cursor:pointer}
.jconv-send:disabled{opacity:.55}
.jconv-status{color:var(--muted,#777);padding:8px 0}
@media(max-width:520px){.jconv-card{min-height:55vh;max-height:none;padding:14px}.jconv-messages{max-height:58vh}.jconv-bubble{max-width:95%}.jconv-send{padding:13px 14px}.jconv-form{position:relative}.jconv-thread{margin-left:5px;padding-left:7px}}

.jconv-attach-row{align-items:center}
#jconv-sticker-open{width:42px;height:42px;padding:0;font-size:25px;font-weight:800;border:0;border-radius:12px;background:#eee5ff;color:#5428a9;cursor:pointer}
#jconv-record-voice,#jconv-send-voice,#jconv-cancel-voice{min-height:42px}
.jconv-sticker-panel{width:100%;box-sizing:border-box;margin-top:10px;padding:12px;border:1px solid #e5dcf2;border-radius:14px;background:#fff;box-shadow:0 8px 24px #24163a14}
.jconv-sticker-panel[hidden]{display:none}
.jconv-sticker-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#30213f}
.jconv-sticker-panel-head button{border:0;background:#f2eaff;color:#5428a9;border-radius:9px;width:32px;height:32px;font-size:22px;cursor:pointer}
.jconv-sticker-gallery{display:grid;grid-template-columns:repeat(auto-fill,70px);grid-auto-rows:70px;gap:9px;max-height:260px;overflow:auto;align-content:start}
.jconv-sticker-choice{width:70px;height:70px;min-width:70px;max-width:70px;padding:0;border:1px solid #eee7f7;border-radius:8px;background:#faf8ff;overflow:hidden;cursor:pointer}
.jconv-sticker-choice img,.jconv-sticker-choice video{display:block;width:70px;height:70px;object-fit:contain}
.jconv-audio-wrap{width:min(100%,340px);max-width:100%;display:flex;align-items:center;gap:8px;padding:8px 9px;background:#f7f5fa;border-radius:24px;box-sizing:border-box}
.jconv-audio-wrap audio{display:block;min-width:0;flex:1;width:100%;height:38px}
.jconv-audio-wrap audio::-webkit-media-controls-overflow-button{display:none!important;-webkit-appearance:none!important;width:0!important;min-width:0!important}
.jconv-audio-wrap audio::-webkit-media-controls-panel{padding-right:2px!important}
.jconv-audio-menu-wrap{position:relative;flex:0 0 auto}
.jconv-audio-menu-button{width:34px;height:34px;border:0;border-radius:50%;background:#eee5ff;color:#5428a9;font-size:22px;font-weight:800;line-height:1;cursor:pointer}
.jconv-audio-menu{position:fixed;right:auto;top:0;left:12px;z-index:9999;width:205px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);overflow-y:auto;padding:9px;background:#fff;border:1px solid #e3d9f0;border-radius:13px;box-shadow:0 10px 28px #24163a2b;color:#30213f;box-sizing:border-box}
.jconv-audio-menu[hidden]{display:none}
.jconv-audio-menu button{border:0;border-radius:8px;padding:8px 9px;background:#f4effb;color:#5428a9;font:600 13px inherit;cursor:pointer}
.jconv-audio-menu .jconv-speed-options{display:flex;gap:5px;margin:6px 0}
.jconv-audio-menu .jconv-speed-options button{flex:1;padding:7px 4px}
.jconv-audio-menu label{display:block;font-size:11px;font-weight:700;margin:8px 0 3px}
.jconv-audio-seek{width:100%;accent-color:#6335c7;margin:4px 0}
.jconv-sticker-message{display:block;width:70px;height:70px;min-width:70px;min-height:70px;max-width:70px;max-height:70px;object-fit:contain}
@media(max-width:520px){.jconv-audio-menu{max-width:calc(100vw - 24px)}.jconv-audio-wrap{width:min(100%,300px)}}

.jconv-sticker-panel{max-height:min(62vh,460px);overflow:hidden;display:flex;flex-direction:column}
.jconv-sticker-gallery{height:240px;max-height:240px;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-gutter:stable}
.jconv-audio-wrap{display:flex;align-items:center;gap:8px}
.jconv-audio-wrap .jconv-media-audio{display:none!important}
.jconv-audio-play{flex:0 0 34px;width:34px;height:34px;border:0;border-radius:50%;background:#f0edf5;color:#24163a;font-size:16px;cursor:pointer}
.jconv-audio-progress{min-width:40px;flex:1;accent-color:#6335c7;touch-action:pan-x}
.jconv-audio-clock{font-size:12px;white-space:nowrap;color:#51465e;font-variant-numeric:tabular-nums}
</style>
<style>
/* WhatsApp-like compact horizontal message bubbles */
.jconv-messages{gap:5px!important;padding:6px 2px!important}.jconv-bubble{width:fit-content;max-width:86%!important;padding:7px 10px!important;margin:2px 0!important;line-height:1.35!important;border-radius:13px!important}.jconv-message-author{display:flex;align-items:center;gap:6px;margin:0 0 3px!important}.jconv-bubble .jconv-body{margin:2px 0!important}.jconv-message-actions{margin-top:3px!important;gap:4px!important}.jconv-thread{margin:5px 0 0 7px!important;padding-left:7px!important}.jconv-bubble.jconv-reply{padding:6px 9px!important;margin:4px 0!important}

<style>
.jconv-messages{max-height:58vh!important;min-height:120px!important;overflow-y:auto!important;overscroll-behavior:contain!important;touch-action:pan-y!important;padding:8px 2px!important;gap:7px!important}
.jconv-bubble{max-width:92%!important;padding:9px 12px!important;border-radius:14px!important;line-height:1.35!important;font-weight:700!important;overflow-wrap:anywhere}
.jconv-message-author{font-size:.9rem!important;margin-bottom:3px!important;font-weight:800!important}
.jconv-message-actions{margin-top:4px!important}
.jconv-message-actions button,.jconv-reply-composer button{padding:6px 10px!important;min-height:36px!important;font-weight:800!important}
.jconv-reply-composer input,.jconv-reply-composer textarea{min-height:38px!important;padding:7px 9px!important;font-weight:700!important}
</style><style id="joint-chat-readable-text">

.jconv-bubble .jconv-body,
.jconv-bubble .jconv-body p,

.jconv-bubble .jconv-body span,
.jconv-bubble.jconv-reply,
.jconv-thread .jconv-body {
  font-weight: 800 !important;
  color: #241b32 !important;
  font-size: 1.04rem !important;
  line-height: 1.6 !important;
}
.jconv-message-author,
.jconv-message-author a {
  font-weight: 800 !important;
  color: #30213f !important;
}
.jconv-meta {
  font-weight: 700 !important;
  color: #514761 !important;
  opacity: 1 !important;
}
</style>

<script src="chat-backend.js"></script><script>document.querySelectorAll("[data-jconv-insert]").forEach(b=>b.addEventListener("click",()=>{const input=document.getElementById("jconv-input");if(!input)return;const value=b.dataset.jconvInsert||b.getAttribute("data-jconv-insert")||"";const start=input.selectionStart??input.value.length,end=input.selectionEnd??start;input.value=input.value.slice(0,start)+value+input.value.slice(end);input.focus();input.setSelectionRange(start+value.length,start+value.length);input.dispatchEvent(new Event("input",{bubbles:true}));}));</script>
