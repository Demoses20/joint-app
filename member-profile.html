<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6938d1"><title>Member profile — JOINT</title><link rel="stylesheet" href="style.css"><style>
.mp-wrap{max-width:900px;margin:0 auto;padding-bottom:32px}.mp-back{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;margin:0 0 14px;border:1px solid var(--line,#e6e0ee);border-radius:12px;background:#fff;color:#5424b5;font-weight:800;text-decoration:none}.mp-hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.mp-identity{display:flex;gap:18px;align-items:center;flex-wrap:wrap;width:100%}.mp-avatar{width:94px;height:94px;flex:0 0 94px;object-fit:cover;border-radius:50%;display:grid;place-items:center;background:#eee5ff;color:#5c2ab9;font-size:2rem;font-weight:800}.mp-details{flex:1;min-width:180px}.mp-details h1{margin:0 0 6px;overflow-wrap:anywhere}.mp-meta{color:var(--muted,#777486);margin:0 0 8px}.mp-bio{white-space:pre-wrap;overflow-wrap:anywhere}.mp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}.mp-stat{background:linear-gradient(145deg,#f5f0ff,#eee5ff);border:1px solid #e7dcfb;border-radius:16px;padding:16px;min-width:0;text-align:center}.mp-stat strong{font-size:1.55rem}.mp-stat span{display:block;margin-top:4px}.mp-stat strong{display:block;font-size:1.3rem;color:#5424b5}.mp-stat span{color:#777486}.mp-message{display:inline-block;text-decoration:none;background:#6938d1;color:#fff;border-radius:12px;padding:12px 20px;font-weight:800}.mp-button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:13px;padding:13px 18px;font-weight:800;min-height:48px}.mp-primary{background:#6938d1;color:#fff}.mp-secondary{background:#f1e9ff;color:#5424b5;border:1px solid #e2d3ff} .mp-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.mp-post{margin:16px 0;padding:18px;border:1px solid var(--line,#e6e0ee);border-radius:20px;background:#fff;overflow-wrap:anywhere;box-shadow:0 8px 24px rgba(42,26,72,.045)}.mp-post-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}.mp-post-avatar{width:48px;height:48px;flex:0 0 48px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#eee5ff;color:#5424b5;text-decoration:none;font-weight:800}.mp-post-avatar img{width:100%;height:100%;object-fit:cover}.mp-post-identity{display:flex;flex-direction:column;gap:4px}.mp-post-author{font-weight:800;color:inherit;text-decoration:none}.mp-post-author:hover{text-decoration:underline}.mp-post time{margin:0}.mp-post time{display:block;color:#777486;font-size:.85rem;margin:4px 0 12px}.mp-post-text{white-space:pre-wrap;line-height:1.7}.mp-media{display:block;width:100%;max-width:100%;max-height:560px;object-fit:contain;background:#171421;border-radius:14px;margin-top:12px}.mp-media-error{color:#777486;background:#f7f4fc;border-radius:10px;padding:12px;font-size:.9rem}.mp-post-actions{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;align-items:stretch;border-top:1px solid #f0ebf6;margin-top:14px;padding:10px 0 2px}.mp-post-actions button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;min-height:49px;height:50px;border:0;background:transparent;color:#777486;border-radius:8px;padding:0 0 10px;cursor:pointer;font:inherit;font-size:1rem;line-height:1.05;transition:transform .16s ease,color .16s ease;overflow:visible}.mp-post-actions button .mp-action-icon{display:flex;align-items:center;justify-content:center;min-height:30px;font-size:1.65rem;line-height:1}.mp-post-actions button .mp-action-icon svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.mp-post-actions button .mp-action-count{position:absolute;bottom:0;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;justify-content:center;min-width:20px;max-width:calc(100% - 2px);height:16px;padding:0 5px;border-radius:999px;background:#f1edf7;color:#51465f;font-size:.65rem;font-weight:800;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mp-post-actions button:hover{color:
